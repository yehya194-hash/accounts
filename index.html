<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ديجيجو - الحضور والانصراف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2fa;--sf:#fff;--tx:#1e0f2e;--mu:#6b5f7c;--bd:#e2d9ee;--pr:#34064F;--ac:#6A32B0;--ok:#16895e;--wn:#c98a00;--rd:#c0392b;--hd:#34064F;--hdt:#fff;--onp:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150c21;--sf:#1f1331;--tx:#efe8f8;--mu:#a99bc0;--bd:#3a2a55;--pr:#c4a2f5;--ac:#8f5fd6;--ok:#4fd1a0;--wn:#f0b429;--rd:#ef6a5b;--hd:#1a0630;--hdt:#efe8f8;--onp:#1a0630;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150c21;--sf:#1f1331;--tx:#efe8f8;--mu:#a99bc0;--bd:#3a2a55;--pr:#c4a2f5;--ac:#8f5fd6;--ok:#4fd1a0;--wn:#f0b429;--rd:#ef6a5b;--hd:#1a0630;--hdt:#efe8f8;--onp:#1a0630;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
header{background:var(--hd);color:var(--hdt);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:20px;font-weight:900}.hb{display:flex;align-items:center;gap:14px}.lg{height:46px;width:auto;background:#fff;border-radius:10px;padding:4px 12px;display:block}
header label{color:inherit}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--sf);border-bottom:1px solid var(--bd)}
nav button,.ch{font-family:inherit;border:0;background:none;padding:8px 14px;border-radius:8px;color:var(--mu);font-weight:600;cursor:pointer;white-space:nowrap;font-size:14px}
.ch{border:1px solid var(--bd);background:var(--sf);padding:6px 14px}
nav button.on,.ch.on{background:var(--pr);color:var(--onp);border-color:var(--pr)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
main{padding:16px;max-width:1150px;margin:auto}
h2{font-size:17px;margin:20px 0 8px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.k{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.k small{color:var(--mu);display:block;font-size:12px}.k b{font-size:20px}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.scr{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:13px}
form{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-top:8px}
label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:2px}
input,select{font-family:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:14px}
button.b{font-family:inherit;background:var(--ac);color:#fff;border:0;padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer}
button.g{font-family:inherit;background:none;border:1px solid var(--bd);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer}
button.x{background:none;border:0;color:var(--rd);cursor:pointer;font-family:inherit;padding:2px 6px}
button.e{color:var(--pr)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.bar{background:var(--bd);border-radius:6px;height:10px;min-width:100px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.ok{color:var(--ok);font-weight:700}.no{color:var(--rd);font-weight:700}.w{color:var(--wn);font-weight:700}
.n{color:var(--mu);font-size:12px;margin:6px 0 0}
.nm{cursor:pointer;color:var(--pr);font-weight:700;text-decoration:underline}
@media print{header label,nav,form,.chips,button.x,button.b,button.g,.box>b{display:none}body{background:#fff}}
.cds{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.cd{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}.cd h3{margin:0;font-size:16px}.cd .st{font-size:13px;color:var(--mu);min-height:40px}.cd button{width:100%}.in{border-color:var(--ac)}.out{opacity:.85}
button.b.gr{background:var(--ok);color:var(--onp)}button.b.rd{background:var(--rd);color:var(--onp)}button.b.am{background:var(--wn);color:#1e0f2e}
.cd.in{border-color:var(--ok);border-width:2px}.cd.ps{border-color:var(--wn);border-width:2px}.cd.no0{border-color:var(--rd);border-width:2px}
.sh{display:flex;align-items:center;gap:8px;margin:18px 0 8px}.sh h2{margin:0}.ct{padding:2px 12px;border-radius:999px;font-weight:700;font-size:13px}.ct.g{background:var(--ok);color:var(--onp)}.ct.r{background:var(--rd);color:var(--onp)}
</style>
</head>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import {getFirestore,collection,doc,getDocs,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

// ===== الصق الـ firebaseConfig بتاعك هنا بدل القيم دي =====
const firebaseConfig = {
  apiKey: "AIzaSyCJuhKq4FxK5Vjlg7DL5PboDPNIDzRzJys",
  authDomain: "digigo-attendance.firebaseapp.com",
  projectId: "digigo-attendance",
  storageBucket: "digigo-attendance.firebasestorage.app",

function st_(m,k){var d=document.getElementById('fbst');if(!d){d=document.createElement('div');d.id='fbst';d.style.cssText='position:fixed;bottom:0;right:0;left:0;padding:8px 14px;font-size:13px;z-index:98;text-align:center;direction:rtl';document.body.appendChild(d)}d.textContent=m;d.style.background=k=='ok'?'#16895e':'#c0392b';d.style.color='#fff';if(k=='ok')setTimeout(function(){d.remove()},3000)}
const db = getFirestore(initializeApp(firebaseConfig));
const synced = {emp:{}, att:{}, set:''};
let ready = false;
const sk = o => JSON.stringify(o, Object.keys(o).sort());
const ordEmp = (a,b) => {
  const na=/^e\d+$/.test(a.id), nb=/^e\d+$/.test(b.id);
  if(na&&nb) return +a.id.slice(1)-+b.id.slice(1);
  if(na) return -1; if(nb) return 1;
  return a.id<b.id?-1:1;
};
function refresh(){
  const a=document.activeElement;
  if(ED||(a&&/INPUT|SELECT/.test(a.tagName)&&$('app').contains(a))) return;
  go(tab);
}
function push(){
  const b=writeBatch(db); let n=0;
  ['emp','att'].forEach(c=>{
    const cur={};
    D[c].forEach(x=>{cur[x.id]=sk(x)});
    Object.keys(cur).forEach(id=>{
      if(synced[c][id]!==cur[id]){b.set(doc(db,c,id),JSON.parse(cur[id]));synced[c][id]=cur[id];n++}
    });
    Object.keys(synced[c]).forEach(id=>{
      if(!(id in cur)){b.delete(doc(db,c,id));delete synced[c][id];n++}
    });
  });
  const st=sk(D.set);
  if(st!==synced.set){b.set(doc(db,'meta','settings'),D.set);synced.set=st;n++}
  if(n) b.commit().then(()=>st_('متصل بالسيرفر ✓ تم الحفظ','ok')).catch(e=>{console.error(e);st_('فشل الحفظ: '+(e.code||'')+' '+(e.message||e),'bad')});
}
window.cloudSave = () => { if(ready) push(); };

function fromSnap(c, snap){
  D[c]=snap.docs.map(d=>({id:d.id,...d.data()}));
  if(c==='emp') D.emp.sort(ordEmp);
  synced[c]={}; D[c].forEach(x=>{synced[c][x.id]=sk(x)});
}

(async function init(){
  try{
    const [e,a,s]=await Promise.all([getDocs(collection(db,'emp')),getDocs(collection(db,'att')),getDocs(collection(db,'meta'))]);
    if(e.empty){ // أول مرة: ارفع البيانات الحالية للسحابة
      ready=true; push();
    }else{
      fromSnap('emp',e); fromSnap('att',a);
      s.docs.forEach(d=>{if(d.id==='settings'){D.set=Object.assign({hrs:8,ded:0},d.data());synced.set=sk(D.set)}});
      ready=true;
      try{localStorage.setItem(KEY,JSON.stringify(D))}catch(x){}
    }
    st_('متصل بقاعدة البيانات ✓','ok');
    go(tab);
    onSnapshot(collection(db,'emp'),sn=>{fromSnap('emp',sn);refresh()});
    onSnapshot(collection(db,'att'),sn=>{fromSnap('att',sn);refresh()});
    onSnapshot(doc(db,'meta','settings'),d=>{if(d.exists()){D.set=Object.assign({hrs:8,ded:0},d.data());synced.set=sk(D.set);refresh()}});
  }catch(err){
    console.error(err);
    st_('فشل الاتصال: '+(err.code||'')+' '+(err.message||err),'bad');
  }
})();
