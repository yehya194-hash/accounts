*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}

main{padding:16px;max-width:1100px;margin:auto}
h2{font-size:17px;margin:20px 0 8px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px}
.k small{color:var(--mu);display:block;font-size:12px}.k b{font-size:21px}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.scr{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:13px}
form{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:2px}
input,select{font-family:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:14px}
button.b{font-family:inherit;background:var(--ac);color:#fff;border:0;padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer}
button.x{background:none;border:0;color:var(--rd);cursor:pointer;font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.bar{background:var(--bd);border-radius:6px;height:10px;min-width:100px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.ok{color:var(--ac);font-weight:700}.no{color:var(--rd);font-weight:700}.w{color:var(--wn);font-weight:700}
.n{color:var(--mu);font-size:12px;margin:6px 0 0}
@media print{header input,nav,form,button.x{display:none}body{background:#fff}}
body.out header,body.out nav,body.out main{display:none}
#lg{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#lg .box{width:100%;max-width:340px;padding:20px}
#lg h1{margin:0 0 12px;font-size:20px}
#lg form{flex-direction:column;align-items:stretch}
#lgm{color:var(--rd);font-size:13px;min-height:20px}
</style>

<script>

function $(i){return document.getElementById(i)}

function rmBtn(c,id){return'<button class="x" onclick="del(\''+c+'\',\''+id+'\')">حذف</button>'}

function sold(id){return sum(D.sales.filter(function(s){return s.e==id&&s.m==M}),'a')}
function unpaid(id){var t=0;D.lv.forEach(function(l){if(l.e==id&&l.t=='بدون مرتب'&&inM(l.a))t+=l.d});return t}

function tot(){var inc=sum(D.inc.filter(function(x){return inM(x.d)}),'a'),ex=sum(D.exp.filter(function(x){return inM(x.d)}),'a'),w=sum(D.wst.filter(function(x){return inM(x.d)}),'c'),p=0;D.emp.forEach(function(e){p+=payroll(e).net});return{inc:inc,ex:ex,w:w,p:p,net:inc-ex-w-p}}
var V={
dash:function(){var t=tot(),sl=D.emp.filter(function(e){return e.tg>0});
return'<div class="kp">'+[['الإيرادات',t.inc,'ok'],['المصروفات',t.ex,''],['الهالك',t.w,'w'],['المرتبات',t.p,''],['صافي الربح',t.net,t.net>=0?'ok':'no']].map(function(k){return'<div class="k"><small>'+k[0]+'</small><b class="'+k[2]+'">'+f(k[1])+'</b> ج.م</div>'}).join('')+'</div><h2>تحقيق التارجت لهذا الشهر</h2><div class="box">'+table(['الموظفة','المبيعات','التارجت','النسبة',''],sl.map(function(e){var s=sold(e.id),p=Math.min(100,s/e.tg*100);return tr([e.n,f(s),f(e.tg),Math.round(s/e.tg*100)+'%','<div class="bar"><i style="width:'+p+'%"></i></div>'])}))+'</div><h2>الغياب والإجازات</h2><div class="box">'+table(['الموظف','أيام الغياب','أيام الإجازة هذا الشهر','رصيد الإجازة'],D.emp.map(function(e){return tr([e.n,absent(e.id),sum(D.lv.filter(function(l){return l.e==e.id&&inM(l.a)}),'d'),e.lv>0?bal(e):'<span class="n">لا إجازة</span>'])}))+'</div>'},

att:function(){var rows=D.att.filter(function(a){return inM(a.d)}).sort(function(a,b){return a.d<b.d?1:-1});return'<div class="box"><form onsubmit="return addA()"><label>الموظف<select id="ae">'+opts(D.emp,'id','n')+'</select></label><label>التاريخ<input id="ad" type="date" value="'+today()+'" required></label><label>الحالة<select id="as"><option>حضور</option><option>غياب</option><option>إجازة</option></select></label><label>الحضور<input id="ai" type="time" value="09:00"></label><label>الانصراف<input id="ao" type="time" value="17:00"></label><button class="b">تسجيل</button></form></div><h2>ملخص الشهر</h2><div class="box">'+table(['الموظف','أيام الحضور','مرات التأخير','أيام الغياب','ساعات العمل'],D.emp.map(function(e){var r=D.att.filter(function(a){return a.e==e.id&&inM(a.d)&&a.s=='حضور'}),h=0,late=0;r.forEach(function(a){h+=hrs(a);if(a.i>D.set.start)late++});return tr([e.n,r.length,late?'<span class="w">'+late+'</span>':0,absent(e.id)||0,h.toFixed(1)])}))+'</div><h2>السجل اليومي</h2><div class="box">'+table(['التاريخ','الموظف','الحالة','حضور','انصراف',''],rows.map(function(a){return tr([a.d,en(a.e),a.s,a.s=='حضور'?a.i:'-',a.s=='حضور'?a.o:'-',rmBtn('att',a.id)])}))+'</div><p class="n">يُحسب التأخير بعد '+D.set.start+'. يخصم يوم الغياب من المرتب تلقائيًا (المرتب ÷ 30).</p>'},
lv:function(){return'<div class="box"><form onsubmit="return addL()"><label>الموظف<select id="le">'+opts(D.emp.filter(function(e){return e.lv>0}),'id','n')+'</select></label><label>النوع<select id="lt"><option>سنوية</option><option>عارضة</option><option>مرضي</option><option>بدون مرتب</option></select></label><label>من<input id="la" type="date" value="'+today()+'" required></label><label>إلى<input id="lb" type="date" value="'+today()+'" required></label><button class="b">تسجيل إجازة</button></form></div><h2>أرصدة الإجازات</h2><div class="box">'+table(['الموظف','الاستحقاق السنوي','المستخدم','المتبقي'],D.emp.map(function(e){return tr([e.n,e.lv>0?e.lv:'<span class="no">لا يوجد</span>',e.lv>0?used(e):'-',e.lv>0?'<b class="'+(bal(e)<=3?'w':'ok')+'">'+bal(e)+'</b>':'-'])}))+'</div><h2>سجل الإجازات</h2><div class="box">'+table(['الموظف','النوع','من','إلى','الأيام',''],D.lv.map(function(l){return tr([en(l.e),l.t,l.a,l.b,l.d,rmBtn('lv',l.id)])}))+'</div>'},
exp:function(){var r=D.exp.filter(function(x){return inM(x.d)});return'<div class="box"><form onsubmit="return addE()"><label>التاريخ<input id="xd" type="date" value="'+today()+'" required></label><label>البند<select id="xc"><option>إيجار</option><option>إعلانات</option><option>برامج واشتراكات</option><option>كهرباء وإنترنت</option><option>مواصلات</option><option>ضيافة</option><option>أخرى</option></select></label><label>البيان<input id="xs"></label><label>المبلغ<input id="xa" type="number" required></label><button class="b">إضافة مصروف</button></form></div><div class="k" style="margin-bottom:12px"><small>إجمالي المصروفات</small><b>'+f(sum(r,'a'))+'</b> ج.م</div><div class="box">'+table(['التاريخ','البند','البيان','المبلغ',''],r.map(function(x){return tr([x.d,x.c,x.s||'-',f(x.a),rmBtn('exp',x.id)])}))+'</div>'},
wst:function(){var r=D.wst.filter(function(x){return inM(x.d)});return'<div class="box"><form onsubmit="return addW()"><label>التاريخ<input id="wd" type="date" value="'+today()+'" required></label><label>الصنف<input id="wi" placeholder="طباعة، خامات، إعلان..." required></label><label>السبب<select id="wr"><option>خطأ في التصميم</option><option>خطأ في الطباعة</option><option>تعديل من العميل</option><option>إعلان بدون نتيجة</option><option>أخرى</option></select></label><label>التكلفة<input id="wc" type="number" required></label><button class="b">تسجيل هالك</button></form></div><div class="k" style="margin-bottom:12px"><small>إجمالي الهالك</small><b class="w">'+f(sum(r,'c'))+'</b> ج.م</div><div class="box">'+table(['التاريخ','الصنف','السبب','التكلفة',''],r.map(function(x){return tr([x.d,x.i,x.r,f(x.c),rmBtn('wst',x.id)])}))+'</div>'},
inc:function(){var r=D.inc.filter(function(x){return inM(x.d)});return'<div class="box"><form onsubmit="return addI()"><label>التاريخ<input id="id" type="date" value="'+today()+'" required></label><label>العميل<input id="ic" required></label><label>الخدمة<input id="is"></label><label>المبلغ المحصّل<input id="ia" type="number" required></label><button class="b">تسجيل إيراد</button></form></div><div class="k" style="margin-bottom:12px"><small>إجمالي الإيرادات</small><b class="ok">'+f(sum(r,'a'))+'</b> ج.م</div><div class="box">'+table(['التاريخ','العميل','الخدمة','المبلغ',''],r.map(function(x){return tr([x.d,x.c,x.s||'-',f(x.a),rmBtn('inc',x.id)])}))+'</div>'},

function hrs(a){if(!a.i||!a.o)return 0;var x=a.i.split(':'),y=a.o.split(':');return Math.max(0,(y[0]*60+ +y[1]-x[0]*60- +x[1])/60)}
function used(e){var u=0;D.lv.forEach(function(l){if(l.e==e.id&&l.t!='بدون مرتب'&&l.t!='مرضي'&&l.a.slice(0,4)==M.slice(0,4))u+=l.d});return u}
function bal(e){return e.lv-used(e)}
function addEmp(){D.emp.push({id:uid(),n:$('en').value,r:$('er').value,sal:+$('es').value,tg:+$('et').value,lv:+$('el').value});save();go('emp');return false}
function addS(){var o=add('sales','s',['e','d','c','a']);o.m=o.d.slice(0,7);D.sales.push(o);save();go('sal');return false}
function addA(){D.att.push(add('att','a',['e','d','s','i','o']));save();go('att');return false}
function addL(){var o=add('lv','l',['e','t','a','b']);o.d=days(o.a,o.b);if(o.d<1){alert('تاريخ النهاية قبل البداية');return false}D.lv.push(o);save();go('lv');return false}
function addE(){D.exp.push(add('exp','x',['d','c','s','a']));save();go('exp');return false}
function addW(){D.wst.push(add('wst','w',['d','i','r','c']));save();go('wst');return false}
function addI(){D.inc.push(add('inc','i',['d','c','s','a']));save();go('inc');return false}
function setS(){D.set.start=$('t1').value;D.set.com=+$('t2').value;save();go('pay');return false}
function expD(){var b=new Blob([JSON.stringify(D)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();}
function impD(inp){var fl=inp.files[0];if(!fl)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x||!x.emp)throw 0;if(!confirm('سيتم استبدال البيانات الحالية بالبيانات من الملف. متابعة؟'))return;D=x;save();go(tab);alert('تم الاستيراد بنجاح')}catch(e){alert('الملف غير صالح')}};r.readAsText(fl);inp.value=''}
function go(t){tab=t;$('nav').innerHTML=TABS.map(function(x){return'<button class="'+(x[0]==t?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('');$('app').innerHTML=V[t]()}
$('mo').value=M;$('mo').onchange=function(){M=this.value||M;go(tab)};
boot();
</script>
